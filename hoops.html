<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Hoops | Game Hub</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="theme-arcade">
  <div class="page-shell">
    <main class="game-page-wrap">
      <section class="game-panel">
        <div class="game-topbar">
          <div class="game-header-left">
            <p class="eyebrow">Flick Sports</p>
            <h1>Neon Hoops</h1>
            <p class="game-subtext">Flick the glowing ball at a rim that never stops moving and stack buckets before the 45-second clock runs dry.</p>
          </div>
          <a href="index.html" class="back-link">&larr; Home</a>
        </div>
        <div class="info-row">
          <div class="status-box">Aim: Drag &amp; Release</div>
          <div class="status-box is-accent" id="hoopsScoreBox">Score: 0</div>
          <div class="status-box" id="hoopsBestBox">Best: 0</div>
          <div class="status-box is-alert" id="hoopsTimeBox">Time: 45</div>
        </div>
        <div class="message-banner" id="hoopsMessage">Drag from the ball, aim the dotted arc, release to shoot.</div>
        <div class="canvas-stage">
          <canvas id="hoopsCanvas" class="game-canvas" width="760" height="460"></canvas>
        </div>
        <div class="bottom-actions">
          <button class="secondary-button" id="hoopsRestart">Restart Game</button>
        </div>
      </section>
    </main>
  </div>
  <script>
(function () {
  'use strict';

  const canvas = document.getElementById('hoopsCanvas');
  const ctx = canvas.getContext('2d');
  const scoreBox = document.getElementById('hoopsScoreBox');
  const bestBox = document.getElementById('hoopsBestBox');
  const timeBox = document.getElementById('hoopsTimeBox');
  const messageEl = document.getElementById('hoopsMessage');
  const restartBtn = document.getElementById('hoopsRestart');

  const W = canvas.width;
  const H = canvas.height;
  const FLOOR_Y = 430;
  const STEP_MS = 1000 / 60;
  const RUN_STEPS = 45 * 60;

  const AMBER = '#fde68a';
  const ORANGE = '#fb923c';
  const CYAN = '#67e8f9';
  const VIOLET = '#a78bfa';
  const PINK = '#f472b6';
  const WHITE = '#f4f6ff';
  const SOFT = '#9aa3c2';
  const CONFETTI_COLORS = [AMBER, ORANGE, CYAN, VIOLET, PINK, WHITE];
  const HINT = 'Drag from the ball, aim the dotted arc, release to shoot.';

  const BALL_R = 13;
  const SPAWN_X = 150;
  const SPAWN_Y = 390;
  const GRAVITY = 0.5;
  const AIR_DRAG = 0.999;
  const LAUNCH_POWER = 0.16;
  const LAUNCH_MAX = 19;

  const RIM_LX = 612;
  const RIM_RX = 668;
  const RIM_CX = (RIM_LX + RIM_RX) / 2;
  const PIN_R = 4.5;
  const BOARD_X = 690;
  const BOARD_W = 7;
  const BOARD_TOP = -85;
  const BOARD_BOT = 25;
  const HOOP_MID = 220;
  const HOOP_AMP = 80;
  const HOOP_BASE_SPEED = 0.011;

  let best = 0;
  try { best = parseInt(localStorage.getItem('neonHoopsBest'), 10) || 0; } catch (err) { best = 0; }

  const ball = { x: SPAWN_X, y: SPAWN_Y, vx: 0, vy: 0, rot: 0 };
  const hoop = { y: HOOP_MID, phase: 0, speed: HOOP_BASE_SPEED };
  const trail = [];
  const particles = [];
  const popups = [];

  let state = 'ready';
  let score = 0;
  let baskets = 0;
  let stepsLeft = RUN_STEPS;
  let clockStarted = false;
  let shownSecs = 45;
  let touchedThisShot = false;
  let scoredThisShot = false;
  let respawnTimer = -1;
  let shake = 0;
  let ripple = 0;
  let netT = 0;
  let newBest = false;

  let dragging = false;
  let dragStartX = 0;
  let dragStartY = 0;
  let dragCurX = 0;
  let dragCurY = 0;
  let dragPointer = null;

  const bg = document.createElement('canvas');
  bg.width = W;
  bg.height = H;
  (function buildBackground() {
    const b = bg.getContext('2d');
    const grad = b.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#070a16');
    grad.addColorStop(0.5, '#0b1024');
    grad.addColorStop(1, '#070a16');
    b.fillStyle = grad;
    b.fillRect(0, 0, W, H);
    for (let i = 0; i < 60; i++) {
      const x = Math.random() * W;
      const y = Math.random() * (FLOOR_Y - 20);
      const r = 0.4 + Math.random() * 1.3;
      const roll = Math.random();
      b.fillStyle = roll < 0.7 ? WHITE : (roll < 0.85 ? CYAN : VIOLET);
      b.globalAlpha = 0.12 + Math.random() * 0.5;
      b.beginPath();
      b.arc(x, y, r, 0, Math.PI * 2);
      b.fill();
    }
    b.globalAlpha = 1;
    const floorGrad = b.createLinearGradient(0, FLOOR_Y, 0, H);
    floorGrad.addColorStop(0, 'rgba(103,232,249,0.08)');
    floorGrad.addColorStop(1, 'rgba(103,232,249,0)');
    b.fillStyle = floorGrad;
    b.fillRect(0, FLOOR_Y, W, H - FLOOR_Y);
    b.strokeStyle = 'rgba(103,232,249,0.10)';
    b.lineWidth = 5;
    b.beginPath();
    b.moveTo(0, FLOOR_Y);
    b.lineTo(W, FLOOR_Y);
    b.stroke();
    b.strokeStyle = 'rgba(167,139,250,0.55)';
    b.lineWidth = 1.5;
    b.beginPath();
    b.moveTo(0, FLOOR_Y);
    b.lineTo(W, FLOOR_Y);
    b.stroke();
    b.strokeStyle = 'rgba(244,246,255,0.07)';
    b.lineWidth = 2;
    b.beginPath();
    b.arc(SPAWN_X, FLOOR_Y, 58, Math.PI, 0);
    b.stroke();
  })();

  function setBanner(text) {
    if (messageEl.textContent !== text) messageEl.textContent = text;
  }

  function spawnBurst(x, y, count, colors, power, lift) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = power * (0.4 + Math.random() * 0.6);
      const lifeVal = 22 + Math.floor(Math.random() * 22);
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - lift,
        life: lifeVal, max: lifeVal,
        color: colors[Math.floor(Math.random() * colors.length)],
        r: 1.5 + Math.random() * 1.8
      });
    }
  }

  function addPopup(x, y, text, color) {
    popups.push({ x: x, y: y, text: text, color: color, life: 55 });
  }

  function resetBall() {
    ball.x = SPAWN_X;
    ball.y = SPAWN_Y;
    ball.vx = 0;
    ball.vy = 0;
    ball.rot = 0;
    trail.length = 0;
    touchedThisShot = false;
    scoredThisShot = false;
    state = 'ready';
  }

  function restart() {
    score = 0;
    baskets = 0;
    stepsLeft = RUN_STEPS;
    clockStarted = false;
    shownSecs = 45;
    newBest = false;
    hoop.phase = 0;
    hoop.speed = HOOP_BASE_SPEED;
    hoop.y = HOOP_MID;
    shake = 0;
    ripple = 0;
    netT = 0;
    respawnTimer = -1;
    particles.length = 0;
    popups.length = 0;
    dragging = false;
    dragPointer = null;
    resetBall();
    scoreBox.textContent = 'Score: 0';
    timeBox.textContent = 'Time: 45';
    setBanner(HINT);
  }

  function endGame() {
    state = 'over';
    dragging = false;
    dragPointer = null;
    setBanner('Time up! Final score ' + score + '. Press Space or Restart to go again.');
  }

  function computeLaunchVel() {
    let vx = (dragStartX - dragCurX) * LAUNCH_POWER;
    let vy = (dragStartY - dragCurY) * LAUNCH_POWER;
    const mag = Math.hypot(vx, vy);
    if (mag > LAUNCH_MAX) {
      const s = LAUNCH_MAX / mag;
      vx *= s;
      vy *= s;
    }
    return { x: vx, y: vy };
  }

  function launch() {
    const pull = Math.hypot(dragStartX - dragCurX, dragStartY - dragCurY);
    if (pull < 12) return;
    const v = computeLaunchVel();
    ball.vx = v.x;
    ball.vy = v.y;
    state = 'flying';
    touchedThisShot = false;
    scoredThisShot = false;
    trail.length = 0;
    if (!clockStarted) {
      clockStarted = true;
      setBanner('Clock is live: 45 seconds on the board!');
    }
  }

  function boardHit(hitX) {
    shake = 3;
    touchedThisShot = true;
    spawnBurst(hitX, ball.y, 4, [CYAN, VIOLET], 3, 0.8);
  }

  function collidePin(px, py) {
    const dx = ball.x - px;
    const dy = ball.y - py;
    const rr = BALL_R + PIN_R;
    const d2 = dx * dx + dy * dy;
    if (d2 >= rr * rr || d2 === 0) return;
    const d = Math.sqrt(d2);
    const nx = dx / d;
    const ny = dy / d;
    ball.x = px + nx * rr;
    ball.y = py + ny * rr;
    const dot = ball.vx * nx + ball.vy * ny;
    if (dot < 0) {
      ball.vx -= 1.5 * dot * nx;
      ball.vy -= 1.5 * dot * ny;
      spawnBurst(px + nx * PIN_R, py + ny * PIN_R, 5, [AMBER, ORANGE, WHITE], 2.6, 0.6);
    }
    touchedThisShot = true;
  }

  function scoreBasket() {
    scoredThisShot = true;
    const swish = !touchedThisShot;
    score += swish ? 3 : 2;
    baskets++;
    hoop.speed = Math.min(0.026, HOOP_BASE_SPEED + Math.floor(baskets / 3) * 0.0022);
    ripple = 8;
    respawnTimer = 40;
    scoreBox.textContent = 'Score: ' + score;
    if (score > best) {
      best = score;
      newBest = true;
      bestBox.textContent = 'Best: ' + best;
      try { localStorage.setItem('neonHoopsBest', String(best)); } catch (err) {}
    }
    addPopup(RIM_CX, hoop.y - 26, swish ? '+3 SWISH' : '+2', swish ? AMBER : CYAN);
    if (swish) spawnBurst(RIM_CX, hoop.y + 6, 14, CONFETTI_COLORS, 4.4, 2.4);
    if (shownSecs > 10) setBanner(swish ? 'SWISH! Clean +3.' : 'Bucket! +2 points.');
  }

  function stepBall(prevRimY) {
    const prevX = ball.x;
    const prevY = ball.y;
    ball.vy += GRAVITY;
    ball.vx *= AIR_DRAG;
    ball.vy *= AIR_DRAG;
    ball.x += ball.vx;
    ball.y += ball.vy;
    ball.rot += ball.vx * 0.02;

    if (ball.y + BALL_R > FLOOR_Y) {
      ball.y = FLOOR_Y - BALL_R;
      if (ball.vy > 0) {
        ball.vy = -ball.vy * 0.62;
        ball.vx *= 0.98;
      }
    }
    if (ball.y - BALL_R < 0) {
      ball.y = BALL_R;
      if (ball.vy < 0) ball.vy = -ball.vy * 0.7;
    }
    if (ball.x - BALL_R < 0) {
      ball.x = BALL_R;
      if (ball.vx < 0) ball.vx = -ball.vx * 0.7;
    }
    if (ball.x + BALL_R > W) {
      ball.x = W - BALL_R;
      if (ball.vx > 0) ball.vx = -ball.vx * 0.7;
    }

    const bbTop = hoop.y + BOARD_TOP;
    const bbBot = hoop.y + BOARD_BOT;
    if (ball.y + BALL_R > bbTop && ball.y - BALL_R < bbBot) {
      if (ball.vx > 0 && prevX + BALL_R <= BOARD_X && ball.x + BALL_R > BOARD_X) {
        ball.x = BOARD_X - BALL_R;
        ball.vx = -ball.vx * 0.55;
        boardHit(BOARD_X - BALL_R);
      } else if (ball.vx < 0 && prevX - BALL_R >= BOARD_X + BOARD_W && ball.x - BALL_R < BOARD_X + BOARD_W) {
        ball.x = BOARD_X + BOARD_W + BALL_R;
        ball.vx = -ball.vx * 0.55;
        boardHit(BOARD_X + BOARD_W + BALL_R);
      }
    }

    collidePin(RIM_LX, hoop.y);
    collidePin(RIM_RX, hoop.y);

    if (!scoredThisShot && ball.vy > 0 && prevY < prevRimY && ball.y >= hoop.y && ball.x > RIM_LX && ball.x < RIM_RX) {
      scoreBasket();
    }

    trail.push({ x: ball.x, y: ball.y });
    if (trail.length > 10) trail.shift();

    if (respawnTimer < 0) {
      const speed = Math.hypot(ball.vx, ball.vy);
      const onFloor = ball.y + BALL_R >= FLOOR_Y - 0.5;
      const gone = ball.x + BALL_R < 0 || ball.x - BALL_R > W;
      if ((onFloor && speed < 0.4) || gone) respawnTimer = 30;
    }
  }

  function updateClock() {
    if (!clockStarted) return;
    stepsLeft--;
    const secs = Math.max(0, Math.ceil(stepsLeft / 60));
    if (secs !== shownSecs) {
      shownSecs = secs;
      timeBox.textContent = 'Time: ' + secs;
      if (secs === 10) setBanner('10 seconds — hurry!');
    }
    if (stepsLeft <= 0) endGame();
  }

  function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.vy += 0.12;
      p.vx *= 0.99;
      p.x += p.vx;
      p.y += p.vy;
      p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function updatePopups() {
    for (let i = popups.length - 1; i >= 0; i--) {
      const p = popups[i];
      p.y -= 0.55;
      p.life--;
      if (p.life <= 0) popups.splice(i, 1);
    }
  }

  function update() {
    if (state === 'over') return;
    netT++;
    shake *= 0.86;
    ripple *= 0.96;
    const prevRimY = hoop.y;
    hoop.phase += hoop.speed;
    hoop.y = HOOP_MID + HOOP_AMP * Math.sin(hoop.phase);

    if (state === 'flying') stepBall(prevRimY);

    if (respawnTimer > 0) {
      respawnTimer--;
      if (respawnTimer === 0) {
        respawnTimer = -1;
        resetBall();
      }
    }

    updateClock();
    updateParticles();
    updatePopups();
  }

  function roundedRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function drawTrail() {
    for (let i = 0; i < trail.length; i++) {
      const t = (i + 1) / trail.length;
      ctx.globalAlpha = t * 0.28;
      ctx.fillStyle = ORANGE;
      ctx.beginPath();
      ctx.arc(trail[i].x, trail[i].y, BALL_R * (0.35 + t * 0.55), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawBackboardAndNet() {
    const bbTop = hoop.y + BOARD_TOP;
    const bbH = BOARD_BOT - BOARD_TOP;
    ctx.strokeStyle = 'rgba(154,163,194,0.5)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(BOARD_X + BOARD_W, hoop.y - 30);
    ctx.lineTo(W, hoop.y - 30);
    ctx.stroke();
    ctx.fillStyle = 'rgba(167,139,250,0.22)';
    ctx.fillRect(BOARD_X, bbTop, BOARD_W, bbH);
    ctx.strokeStyle = 'rgba(167,139,250,0.9)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(BOARD_X + 0.5, bbTop + 0.5, BOARD_W - 1, bbH - 1);

    const topY = hoop.y + 2;
    const netH = 40;
    ctx.strokeStyle = 'rgba(244,246,255,0.55)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const t0 = i / 6;
      const t1 = (i + 1) / 6;
      const topX0 = RIM_LX + t0 * (RIM_RX - RIM_LX);
      const topX1 = RIM_LX + t1 * (RIM_RX - RIM_LX);
      const sway0 = Math.sin(netT * 0.22 + i * 1.25) * ripple;
      const sway1 = Math.sin(netT * 0.22 + (i + 1) * 1.25) * ripple;
      const botX0 = RIM_LX + 12 + t0 * (RIM_RX - RIM_LX - 24) + sway0;
      const botX1 = RIM_LX + 12 + t1 * (RIM_RX - RIM_LX - 24) + sway1;
      ctx.moveTo(topX0, topY);
      ctx.lineTo(botX1, topY + netH);
      ctx.moveTo(topX1, topY);
      ctx.lineTo(botX0, topY + netH);
    }
    ctx.stroke();
  }

  function drawRim() {
    ctx.save();
    ctx.strokeStyle = PINK;
    ctx.lineWidth = 3.5;
    ctx.shadowColor = PINK;
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(RIM_LX, hoop.y);
    ctx.lineTo(RIM_RX, hoop.y);
    ctx.stroke();
    ctx.shadowColor = AMBER;
    ctx.shadowBlur = 9;
    ctx.fillStyle = AMBER;
    ctx.beginPath();
    ctx.arc(RIM_LX, hoop.y, PIN_R, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(RIM_RX, hoop.y, PIN_R, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawBall() {
    ctx.save();
    ctx.translate(ball.x, ball.y);
    ctx.rotate(ball.rot);
    const grad = ctx.createRadialGradient(-4, -5, 2, 0, 0, BALL_R + 1);
    grad.addColorStop(0, '#fed7aa');
    grad.addColorStop(0.45, ORANGE);
    grad.addColorStop(1, '#b45309');
    ctx.shadowColor = 'rgba(251,146,60,0.8)';
    ctx.shadowBlur = 16;
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, BALL_R, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.arc(0, 0, BALL_R, 0, Math.PI * 2);
    ctx.clip();
    ctx.strokeStyle = 'rgba(120,53,15,0.8)';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(-15, 0, 11, -1.5, 1.5);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(15, 0, 11, Math.PI - 1.5, Math.PI + 1.5);
    ctx.stroke();
    ctx.restore();
  }

  function drawReadyRing() {
    const pulse = 3 + Math.sin(netT * 0.08) * 2;
    ctx.strokeStyle = 'rgba(103,232,249,0.35)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, BALL_R + 6 + pulse, 0, Math.PI * 2);
    ctx.stroke();
  }

  function drawAim() {
    ctx.strokeStyle = 'rgba(154,163,194,0.7)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.moveTo(ball.x, ball.y);
    ctx.lineTo(dragCurX, dragCurY);
    ctx.stroke();
    ctx.setLineDash([]);
    const v = computeLaunchVel();
    let px = ball.x;
    let py = ball.y;
    let pvx = v.x;
    let pvy = v.y;
    ctx.fillStyle = CYAN;
    for (let i = 1; i <= 26; i++) {
      pvy += GRAVITY;
      pvx *= AIR_DRAG;
      pvy *= AIR_DRAG;
      px += pvx;
      py += pvy;
      if (i % 2 === 0) {
        ctx.globalAlpha = Math.max(0.08, 0.8 - i * 0.028);
        ctx.beginPath();
        ctx.arc(px, py, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawParticles() {
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      ctx.globalAlpha = Math.min(1, p.life / p.max);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawPopups() {
    if (!popups.length) return;
    ctx.textAlign = 'center';
    ctx.font = 'bold 15px "Segoe UI", Arial, sans-serif';
    for (let i = 0; i < popups.length; i++) {
      const p = popups[i];
      ctx.globalAlpha = Math.min(1, p.life / 35);
      ctx.fillStyle = p.color;
      ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }

  function drawOverlay() {
    ctx.fillStyle = 'rgba(4,6,16,0.45)';
    ctx.fillRect(0, 0, W, H);
    const pw = 440;
    const ph = 240;
    const px0 = (W - pw) / 2;
    const py0 = (H - ph) / 2;
    roundedRect(ctx, px0, py0, pw, ph, 18);
    ctx.fillStyle = 'rgba(5,8,20,0.78)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(103,232,249,0.45)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.textAlign = 'center';
    ctx.fillStyle = AMBER;
    ctx.font = 'bold 30px "Segoe UI", Arial, sans-serif';
    ctx.fillText('TIME UP', W / 2, py0 + 62);
    ctx.fillStyle = WHITE;
    ctx.font = '18px "Segoe UI", Arial, sans-serif';
    ctx.fillText('Final Score: ' + score, W / 2, py0 + 104);
    ctx.fillStyle = newBest ? PINK : CYAN;
    ctx.font = '15px "Segoe UI", Arial, sans-serif';
    ctx.fillText(newBest ? 'New Best: ' + best : 'Best: ' + best, W / 2, py0 + 134);
    ctx.fillStyle = SOFT;
    ctx.font = '13px "Segoe UI", Arial, sans-serif';
    ctx.fillText('Press Space, click the court, or hit Restart to run it back.', W / 2, py0 + 196);
    ctx.textAlign = 'left';
  }

  function render() {
    ctx.drawImage(bg, 0, 0);
    ctx.save();
    if (shake > 0.1) {
      ctx.translate((Math.random() - 0.5) * shake * 2, (Math.random() - 0.5) * shake * 2);
    }
    drawTrail();
    drawBackboardAndNet();
    drawBall();
    drawRim();
    if (dragging) drawAim();
    else if (state === 'ready') drawReadyRing();
    drawParticles();
    drawPopups();
    ctx.restore();
    if (state === 'over') drawOverlay();
  }

  function canvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) * (canvas.width / rect.width),
      y: (e.clientY - rect.top) * (canvas.height / rect.height)
    };
  }

  canvas.style.touchAction = 'none';

  canvas.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    if (state === 'over') {
      restart();
      return;
    }
    if (state !== 'ready' || dragging) return;
    const p = canvasPos(e);
    if (Math.hypot(p.x - ball.x, p.y - ball.y) > 60) return;
    dragging = true;
    dragPointer = e.pointerId;
    dragStartX = p.x;
    dragStartY = p.y;
    dragCurX = p.x;
    dragCurY = p.y;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  });

  canvas.addEventListener('pointermove', function (e) {
    if (!dragging || e.pointerId !== dragPointer) return;
    const p = canvasPos(e);
    dragCurX = p.x;
    dragCurY = p.y;
  });

  canvas.addEventListener('pointerup', function (e) {
    if (!dragging || e.pointerId !== dragPointer) return;
    const p = canvasPos(e);
    dragCurX = p.x;
    dragCurY = p.y;
    dragging = false;
    dragPointer = null;
    launch();
  });

  canvas.addEventListener('pointercancel', function (e) {
    if (e.pointerId === dragPointer) {
      dragging = false;
      dragPointer = null;
    }
  });

  document.addEventListener('keydown', function (e) {
    const k = e.code;
    if (k === 'Space' || k === 'ArrowUp' || k === 'ArrowDown' || k === 'ArrowLeft' || k === 'ArrowRight') {
      e.preventDefault();
      if (k === 'Space' && state === 'over') restart();
    }
  });

  restartBtn.addEventListener('click', function () {
    restart();
    restartBtn.blur();
  });

  bestBox.textContent = 'Best: ' + best;
  setBanner(HINT);

  let lastTime = performance.now();
  let acc = 0;
  function frame(now) {
    let dt = now - lastTime;
    lastTime = now;
    if (dt > 100) dt = 100;
    acc += dt;
    while (acc >= STEP_MS) {
      update();
      acc -= STEP_MS;
    }
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
  </script>
</body>
</html>

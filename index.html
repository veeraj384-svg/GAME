<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Que - Spanish Practice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --orange: #f97316; }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #191919;
      color: #ececec;
      font-family: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
    }

    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 72px 24px;
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .sub {
      color: #9a9a9a;
      font-size: 15px;
      margin-bottom: 40px;
    }

    ul { list-style: none; }

    li a {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 0;
      border-top: 1px solid #2e2e2e;
      color: inherit;
      text-decoration: none;
    }
    li:last-child a { border-bottom: 1px solid #2e2e2e; }

    .title { font-size: 16px; }
    .desc { color: #9a9a9a; font-size: 14px; }

    li a:hover .title { color: var(--orange); }
  </style>
</head>

<body>
  <main>
    <h1>Que</h1>
    <p class="sub">Made by Veeraj Dave</p>

    <ul id="games"></ul>
  </main>

  <script>
    // [title, genre, link]
    const games = [
      ["Nova Run", "Platformer", "platformer.html"],
      ["Neon Slash", "Action", "neonslash.html"],
      ["Gravity Flip", "Runner", "gravityflip.html"],
      ["Asteroid Blaster", "Shooter", "asteroid.html"],
      ["Neon Dash", "Survival", "neondash.html"],
      ["Neon Tap", "Reflex", "neontap.html"],
      ["Orbit Shift", "Orbit", "orbit.html"],
      ["Neon Stack", "Timing", "stack.html"],
      ["Neon Hoops", "Sports", "hoops.html"]
    ];

    document.getElementById("games").innerHTML = games.map(([title, genre, href]) => `
      <li><a href="${href}"><span class="title">${title}</span><span class="desc">${genre}</span></a></li>`).join("");
  </script>
</body>
</html>

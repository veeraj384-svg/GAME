<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Stack | Game Hub</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="theme-puzzle">
  <div class="page-shell">
    <main class="game-page-wrap">
      <section class="game-panel">
        <div class="game-topbar">
          <div class="game-header-left">
            <p class="eyebrow">Timing Tower</p>
            <h1>Neon Stack</h1>
            <p class="game-subtext">Drop the gliding slab at the perfect moment to keep your neon tower climbing.</p>
          </div>
          <a href="index.html" class="back-link">&larr; Home</a>
        </div>
        <div class="info-row">
          <div class="status-box">Drop: Space / Click</div>
          <div class="status-box is-accent" id="stackScoreBox">Height: 0</div>
          <div class="status-box" id="stackBestBox">Best: 0</div>
          <div class="status-box" id="stackComboBox">Perfect streak: 0</div>
        </div>
        <div class="message-banner" id="stackMessage">Land flush with the layer below — within 5px is a PERFECT and rebuilds lost width.</div>
        <div class="canvas-stage">
          <canvas id="stackCanvas" class="game-canvas" width="760" height="460"></canvas>
        </div>
        <div class="bottom-actions">
          <button class="secondary-button" id="stackRestart">Restart Tower</button>
        </div>
      </section>
    </main>
  </div>
  <script>
    (() => {
      'use strict';
      const canvas = document.getElementById('stackCanvas');
      const ctx = canvas.getContext('2d');
      const W = canvas.width;
      const H = canvas.height;
      const scoreBox = document.getElementById('stackScoreBox');
      const bestBox = document.getElementById('stackBestBox');
      const comboBox = document.getElementById('stackComboBox');
      const banner = document.getElementById('stackMessage');
      const restartBtn = document.getElementById('stackRestart');

      const PALETTE = ['#67e8f9', '#a78bfa', '#f472b6', '#fde68a', '#86efac'];
      const BASE_W = 240;
      const SLAB_H = 26;
      const MARGIN = 40;
      const PERFECT_TOL = 5;
      const PARTICLE_CAP = 220;
      const BEST_KEY = 'neonStackBest';
      const BOTTOM_CAM = H - 56;
      const STEP_MS = 1000 / 60;

      function lighten(hex, t) {
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        const mix = (c) => Math.round(c + (255 - c) * t);
        return 'rgb(' + mix(r) + ',' + mix(g) + ',' + mix(b) + ')';
      }
      const LIGHT = PALETTE.map((c) => lighten(c, 0.55));

      const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
      bgGrad.addColorStop(0, '#0a0f30');
      bgGrad.addColorStop(0.5, '#161d52');
      bgGrad.addColorStop(1, '#0a0f30');

      const stars = [];
      for (let i = 0; i < 60; i++) {
        stars.push({
          x: Math.random() * W,
          y: Math.random() * H,
          r: 0.5 + Math.random() * 1.4,
          phase: Math.random() * Math.PI * 2,
          spd: 0.02 + Math.random() * 0.05
        });
      }

      let best = 0;
      try { best = Math.max(0, parseInt(localStorage.getItem(BEST_KEY), 10) || 0); } catch (err) {}

      let layers, mover, debris, particles, popups;
      let cam, camTarget, shake, streak, height, state, fromLeft, tick, overDelay, record;

      function setText(el, text) {
        if (el.__last !== text) {
          el.__last = text;
          el.textContent = text;
        }
      }
      function updateHud() {
        setText(scoreBox, 'Height: ' + height);
        setText(bestBox, 'Best: ' + best);
        setText(comboBox, 'Perfect streak: ' + streak);
      }

      function rr(x, y, w, h, r) {
        const rad = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + rad, y);
        ctx.arcTo(x + w, y, x + w, y + h, rad);
        ctx.arcTo(x + w, y + h, x, y + h, rad);
        ctx.arcTo(x, y + h, x, y, rad);
        ctx.arcTo(x, y, x + w, y, rad);
        ctx.closePath();
      }

      function spawnMover() {
        const top = layers[layers.length - 1];
        const w = top.w;
        mover = {
          w: w,
          y: top.y - SLAB_H,
          x: fromLeft ? MARGIN : W - MARGIN - w,
          dir: fromLeft ? 1 : -1,
          speed: Math.min(8.5, 3.2 + height * 0.12),
          ci: layers.length % PALETTE.length
        };
        fromLeft = !fromLeft;
      }

      function reset() {
        layers = [{ x: (W - BASE_W) / 2, y: 0, w: BASE_W, ci: 0, flash: 0, pop: 0 }];
        debris = [];
        particles = [];
        popups = [];
        height = 0;
        streak = 0;
        shake = 0;
        tick = 0;
        overDelay = 0;
        record = false;
        fromLeft = true;
        cam = BOTTOM_CAM;
        camTarget = BOTTOM_CAM;
        state = 'ready';
        spawnMover();
        updateHud();
        setText(banner, 'Land flush with the layer below — within 5px is a PERFECT and rebuilds lost width.');
      }

      function addParticle(p) {
        if (particles.length >= PARTICLE_CAP) particles.shift();
        particles.push(p);
      }
      function sparkles(x, y, color, n) {
        for (let i = 0; i < n; i++) {
          const a = Math.random() * Math.PI * 2;
          const s = 1 + Math.random() * 2.4;
          addParticle({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1, life: 34, max: 34, color: color, size: 1.5 + Math.random() * 2, g: 0.06 });
        }
      }
      function dust(x, y, color, n) {
        for (let i = 0; i < n; i++) {
          addParticle({ x: x + (Math.random() - 0.5) * 6, y: y + (Math.random() - 0.5) * SLAB_H, vx: (Math.random() - 0.5) * 2.2, vy: -Math.random() * 1.6, life: 26, max: 26, color: color, size: 1 + Math.random() * 1.6, g: 0.1 });
        }
      }
      function addDebris(x, y, w, ci, kick) {
        debris.push({
          x: x + w / 2, y: y + SLAB_H / 2, w: w, h: SLAB_H, ci: ci,
          vx: kick + (Math.random() - 0.5), vy: -1 - Math.random() * 1.5,
          rot: 0, vr: (Math.random() - 0.5) * 0.18, life: 50, max: 50
        });
      }
      function addPopup(x, y, text, color) {
        popups.push({ x: x, y: y, text: text, color: color, life: 55, max: 55 });
      }

      function gameOver() {
        state = 'over';
        mover = null;
        shake = 9;
        overDelay = 30;
        setText(banner, 'The tower toppled at height ' + height + '. Press Space or click to rebuild.');
        updateHud();
      }

      function drop() {
        const top = layers[layers.length - 1];
        const left = Math.max(mover.x, top.x);
        const right = Math.min(mover.x + mover.w, top.x + top.w);
        const overlap = right - left;
        if (overlap <= 0) {
          addDebris(mover.x, mover.y, mover.w, mover.ci, mover.dir * mover.speed * 0.5);
          gameOver();
          return;
        }
        const offset = mover.x - top.x;
        let nx = left;
        let nw = overlap;
        if (Math.abs(offset) < PERFECT_TOL) {
          streak += 1;
          nw = Math.min(BASE_W, mover.w + 8);
          nx = top.x - (nw - mover.w) / 2;
          layers.push({ x: nx, y: mover.y, w: nw, ci: mover.ci, flash: 8, pop: 6 });
          addPopup(nx + nw / 2, mover.y - 12, 'PERFECT ×' + streak, PALETTE[mover.ci]);
          sparkles(nx + nw / 2, mover.y + SLAB_H / 2, PALETTE[mover.ci], 10);
          shake = Math.max(shake, 2);
          setText(banner, streak >= 3 ? 'Blazing! ' + streak + ' perfect drops in a row.' : 'Perfect drop — width restored.');
        } else {
          streak = 0;
          const cutW = mover.w - overlap;
          const cutX = offset < 0 ? mover.x : top.x + top.w;
          addDebris(cutX, mover.y, cutW, mover.ci, offset < 0 ? -1.5 : 1.5);
          dust(offset < 0 ? left : right, mover.y + SLAB_H / 2, PALETTE[mover.ci], 8);
          shake = Math.max(shake, Math.min(5, 1 + cutW * 0.05));
          layers.push({ x: nx, y: mover.y, w: nw, ci: mover.ci, flash: 0, pop: 6 });
          setText(banner, 'Sliced ' + Math.round(cutW) + 'px — keep it tight.');
        }
        height += 1;
        if (height > best) {
          best = height;
          record = true;
          try { localStorage.setItem(BEST_KEY, String(best)); } catch (err) {}
        }
        camTarget = Math.max(BOTTOM_CAM, H * 0.62 + height * SLAB_H);
        spawnMover();
        updateHud();
      }

      function update() {
        tick += 1;
        cam += (camTarget - cam) * 0.12;
        if (shake > 0) shake = Math.max(0, shake * 0.88 - 0.02);
        if (mover && state !== 'over') {
          mover.x += mover.speed * mover.dir;
          const maxX = W - MARGIN - mover.w;
          if (mover.x <= MARGIN) { mover.x = MARGIN; mover.dir = 1; }
          else if (mover.x >= maxX) { mover.x = maxX; mover.dir = -1; }
        }
        if (state === 'over' && overDelay > 0) overDelay -= 1;
        for (let i = Math.max(0, layers.length - 4); i < layers.length; i++) {
          const l = layers[i];
          if (l.flash > 0) l.flash -= 1;
          if (l.pop > 0) l.pop -= 1;
        }
        for (let i = debris.length - 1; i >= 0; i--) {
          const d = debris[i];
          d.vy += 0.5;
          d.x += d.vx;
          d.y += d.vy;
          d.rot += d.vr;
          d.life -= 1;
          if (d.life <= 0) debris.splice(i, 1);
        }
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.vy += p.g;
          p.x += p.vx;
          p.y += p.vy;
          p.life -= 1;
          if (p.life <= 0) particles.splice(i, 1);
        }
        for (let i = popups.length - 1; i >= 0; i--) {
          const p = popups[i];
          p.y -= 0.6;
          p.life -= 1;
          if (p.life <= 0) popups.splice(i, 1);
        }
      }

      function drawSlab(l) {
        const color = PALETTE[l.ci];
        ctx.save();
        if (l.pop > 0) {
          const s = 1 + 0.06 * (l.pop / 6);
          const cx = l.x + l.w / 2;
          const cy = l.y + SLAB_H / 2;
          ctx.translate(cx, cy);
          ctx.scale(s, s);
          ctx.translate(-cx, -cy);
        }
        ctx.fillStyle = color + '2e';
        rr(l.x, l.y, l.w, SLAB_H, 4);
        ctx.fill();
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.strokeStyle = LIGHT[l.ci];
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(l.x + 3, l.y + 1.5);
        ctx.lineTo(l.x + l.w - 3, l.y + 1.5);
        ctx.stroke();
        if (l.flash > 0) {
          ctx.fillStyle = 'rgba(255,255,255,' + (0.75 * l.flash / 8).toFixed(3) + ')';
          rr(l.x, l.y, l.w, SLAB_H, 4);
          ctx.fill();
        }
        ctx.restore();
      }

      function drawOverlay() {
        ctx.fillStyle = 'rgba(3,5,12,0.5)';
        ctx.fillRect(0, 0, W, H);
        const pw = 400;
        const ph = 230;
        const px = (W - pw) / 2;
        const py = (H - ph) / 2;
        ctx.fillStyle = 'rgba(5,8,20,0.78)';
        rr(px, py, pw, ph, 18);
        ctx.fill();
        ctx.strokeStyle = 'rgba(103,232,249,0.55)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.textAlign = 'center';
        ctx.save();
        ctx.shadowColor = '#67e8f9';
        ctx.shadowBlur = 18;
        ctx.fillStyle = '#67e8f9';
        ctx.font = '800 28px "Segoe UI", system-ui, sans-serif';
        ctx.fillText('TOWER TOPPLED', W / 2, py + 58);
        ctx.restore();
        ctx.fillStyle = '#e2e8f0';
        ctx.font = '600 18px "Segoe UI", system-ui, sans-serif';
        ctx.fillText('Final height: ' + height, W / 2, py + 102);
        ctx.fillStyle = record ? '#fde68a' : '#94a3b8';
        ctx.font = '600 16px "Segoe UI", system-ui, sans-serif';
        ctx.fillText(record ? 'New best: ' + best + '!' : 'Best: ' + best, W / 2, py + 132);
        ctx.fillStyle = 'rgba(226,232,240,0.75)';
        ctx.font = '500 14px "Segoe UI", system-ui, sans-serif';
        ctx.fillText('Press Space, click, or hit Restart Tower to rebuild', W / 2, py + 178);
      }

      function render() {
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#9fb4ff';
        for (let i = 0; i < stars.length; i++) {
          const s = stars[i];
          ctx.globalAlpha = Math.max(0.08, 0.35 + 0.3 * Math.sin(tick * s.spd + s.phase));
          ctx.fillRect(s.x, s.y, s.r, s.r);
        }
        ctx.globalAlpha = 1;

        ctx.save();
        const sx = shake > 0.05 ? (Math.random() - 0.5) * 2 * shake : 0;
        const sy = shake > 0.05 ? (Math.random() - 0.5) * 2 * shake : 0;
        ctx.translate(sx, cam + sy);

        if (SLAB_H + cam < H + 20) {
          ctx.strokeStyle = 'rgba(103,232,249,0.25)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(0, SLAB_H + 3);
          ctx.lineTo(W, SLAB_H + 3);
          ctx.stroke();
        }

        for (let i = 0; i < layers.length; i++) {
          const l = layers[i];
          const ly = l.y + cam;
          if (ly > H + 40 || ly < -40) continue;
          drawSlab(l);
        }

        if (mover && state !== 'over') {
          ctx.save();
          ctx.shadowColor = PALETTE[mover.ci];
          ctx.shadowBlur = 16;
          drawSlab({ x: mover.x, y: mover.y, w: mover.w, ci: mover.ci, flash: 0, pop: 0 });
          ctx.restore();
        }

        for (let i = 0; i < debris.length; i++) {
          const d = debris[i];
          if (d.y + cam > H + 80) continue;
          ctx.save();
          ctx.globalAlpha = Math.max(0, d.life / d.max);
          ctx.translate(d.x, d.y);
          ctx.rotate(d.rot);
          ctx.fillStyle = PALETTE[d.ci] + '2e';
          ctx.fillRect(-d.w / 2, -d.h / 2, d.w, d.h);
          ctx.strokeStyle = PALETTE[d.ci];
          ctx.lineWidth = 2;
          ctx.strokeRect(-d.w / 2, -d.h / 2, d.w, d.h);
          ctx.restore();
        }

        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          ctx.globalAlpha = Math.max(0, p.life / p.max);
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
        }
        ctx.globalAlpha = 1;

        ctx.textAlign = 'center';
        ctx.font = '700 16px "Segoe UI", system-ui, sans-serif';
        for (let i = 0; i < popups.length; i++) {
          const p = popups[i];
          ctx.globalAlpha = Math.max(0, p.life / p.max);
          ctx.fillStyle = p.color;
          ctx.fillText(p.text, p.x, p.y);
        }
        ctx.globalAlpha = 1;
        ctx.restore();

        if (state === 'ready') {
          ctx.textAlign = 'center';
          ctx.globalAlpha = 0.6 + 0.3 * Math.sin(tick * 0.06);
          ctx.fillStyle = '#e2e8f0';
          ctx.font = '600 17px "Segoe UI", system-ui, sans-serif';
          ctx.fillText('Press Space or click to drop the first slab', W / 2, H * 0.3);
          ctx.globalAlpha = 1;
        }
        if (state === 'over') drawOverlay();
      }

      function action() {
        if (state === 'over') {
          if (overDelay <= 0) reset();
          return;
        }
        if (state === 'ready') state = 'play';
        drop();
      }

      document.addEventListener('keydown', (e) => {
        const k = e.code;
        if (k === 'Space' || k === 'ArrowUp' || k === 'ArrowDown' || k === 'ArrowLeft' || k === 'ArrowRight') e.preventDefault();
        if (k === 'Space') action();
      });
      canvas.addEventListener('mousedown', (e) => {
        e.preventDefault();
        action();
      });
      canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        action();
      }, { passive: false });
      restartBtn.addEventListener('click', () => {
        reset();
        restartBtn.blur();
      });

      let last = performance.now();
      let acc = 0;
      function frame(now) {
        let dt = now - last;
        last = now;
        if (dt > 100) dt = 100;
        acc += dt;
        while (acc >= STEP_MS) {
          update();
          acc -= STEP_MS;
        }
        render();
        requestAnimationFrame(frame);
      }

      reset();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Slash | Game Hub</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="theme-neon">
  <div class="page-shell">
    <main class="game-page-wrap">
      <section class="game-panel">
        <div class="game-topbar">
          <div class="game-header-left">
            <p class="eyebrow">Blade Action</p>
            <h1>Neon Slash</h1>
            <p class="game-subtext">Sweep your blade through glowing orbs, chain combos, and never touch the bombs.</p>
          </div>
          <a href="index.html" class="back-link">&larr; Home</a>
        </div>
        <div class="info-row">
          <div class="status-box">Sweep the pointer to slice &middot; avoid bombs</div>
          <div class="status-box is-accent" id="slashScoreBox">Score: 0</div>
          <div class="status-box" id="slashBestBox">Best: 0</div>
          <div class="status-box is-alert" id="slashLivesBox">Lives: &#9829;&#9829;&#9829;</div>
        </div>
        <div class="message-banner" id="slashMessage">Click to start - sweep your blade through the orbs</div>
        <div class="canvas-stage">
          <canvas id="slashCanvas" class="game-canvas" width="760" height="460"></canvas>
        </div>
        <div class="bottom-actions">
          <button class="secondary-button" id="slashRestart">Restart</button>
        </div>
      </section>
    </main>
  </div>
  <script>
    const canvas = document.getElementById('slashCanvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;
    const scoreBox = document.getElementById('slashScoreBox');
    const bestBox = document.getElementById('slashBestBox');
    const livesBox = document.getElementById('slashLivesBox');
    const messageBanner = document.getElementById('slashMessage');
    const restartBtn = document.getElementById('slashRestart');

    const COLORS = ['#67e8f9', '#a78bfa', '#f472b6', '#fde68a', '#86efac'];
    const STEP = 1 / 60;
    const MAX_PARTICLES = 220;
    const BEST_KEY = 'neonSlashBest';

    let state = 'start';
    let score = 0;
    let best = Number(localStorage.getItem(BEST_KEY)) || 0;
    let lives = 3;
    let combo = 1;
    let lastSliceTime = -9999;
    let spawnTimer = 0;
    let shake = 0;
    let flash = 0;
    let slowmo = 0;
    let frameCount = 0;

    const orbs = [];
    const fragments = [];
    const particles = [];
    const popups = [];
    const trail = [];
    let pointerDown = false;

    let shownScore = -1;
    let shownBest = -1;
    let shownLives = -1;
    let shownMessage = '';

    const bgGradient = ctx.createLinearGradient(0, 0, 0, H);
    bgGradient.addColorStop(0, '#0a0f30');
    bgGradient.addColorStop(0.5, '#161d52');
    bgGradient.addColorStop(1, '#0a0f30');

    function setMessage(text) {
      if (text !== shownMessage) {
        shownMessage = text;
        messageBanner.textContent = text;
      }
    }

    function syncBoxes() {
      if (score !== shownScore) {
        shownScore = score;
        scoreBox.textContent = 'Score: ' + score;
      }
      if (best !== shownBest) {
        shownBest = best;
        bestBox.textContent = 'Best: ' + best;
      }
      if (lives !== shownLives) {
        shownLives = lives;
        livesBox.textContent = 'Lives: ' + '♥'.repeat(Math.max(0, lives));
      }
    }

    function rand(min, max) {
      return min + Math.random() * (max - min);
    }

    function spawnGapFrames() {
      return Math.max(48, 95 - score);
    }

    function spawnWave() {
      const maxExtra = Math.min(4, 1 + Math.floor(score / 12));
      const count = 1 + Math.floor(Math.random() * maxExtra);
      for (let i = 0; i < count; i++) {
        const x = rand(90, W - 90);
        const bombChance = Math.min(0.05 + score * 0.002, 0.16);
        orbs.push({
          x: x,
          y: H + 30,
          vx: (W / 2 - x) * 0.006 + (Math.random() - 0.5) * 1.6,
          vy: -(10.6 + Math.random() * 3.0),
          r: rand(16, 26),
          color: COLORS[Math.floor(Math.random() * COLORS.length)],
          bomb: Math.random() < bombChance,
          pop: 0
        });
      }
    }

    function addParticle(p) {
      if (particles.length < MAX_PARTICLES) particles.push(p);
    }

    function burstParticles(x, y, color, count, speed) {
      for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = rand(speed * 0.35, speed);
        addParticle({
          x: x, y: y,
          vx: Math.cos(a) * s,
          vy: Math.sin(a) * s,
          size: rand(1.5, 3.6),
          color: color,
          life: 1,
          decay: rand(0.02, 0.045)
        });
      }
    }

    function addPopup(x, y, text, color, size) {
      popups.push({ x: x, y: y, text: text, color: color, size: size, life: 1 });
    }

    function sliceOrb(orb, index) {
      orbs.splice(index, 1);
      if (orb.bomb) {
        lives--;
        combo = 1;
        shake = 18;
        flash = 0.35;
        slowmo = 20;
        burstParticles(orb.x, orb.y, '#f472b6', 26, 7);
        burstParticles(orb.x, orb.y, '#fde68a', 14, 5);
        addPopup(orb.x, orb.y, 'BOOM!', '#f472b6', 26);
        if (lives <= 0) endGame();
        else setMessage('Boom! That was a bomb - watch for the pink ring');
        return;
      }
      const now = performance.now();
      combo = (now - lastSliceTime <= 350) ? combo + 1 : 1;
      lastSliceTime = now;
      const points = combo;
      score += points;
      if (score > best) {
        best = score;
        localStorage.setItem(BEST_KEY, best);
      }
      addPopup(orb.x, orb.y - orb.r, '+' + points, orb.color, 18);
      if (combo >= 2) addPopup(orb.x, orb.y - orb.r - 22, 'x' + combo + ' COMBO', orb.color, 14);
      const splitAngle = Math.random() * Math.PI;
      for (let s = -1; s <= 1; s += 2) {
        fragments.push({
          x: orb.x, y: orb.y,
          vx: orb.vx + Math.cos(splitAngle) * 2.4 * s,
          vy: orb.vy * 0.4 + Math.sin(splitAngle) * 2.4 * s - 1.2,
          r: orb.r,
          color: orb.color,
          angle: splitAngle + (s > 0 ? 0 : Math.PI),
          spin: rand(-0.14, 0.14),
          life: 1
        });
      }
      burstParticles(orb.x, orb.y, orb.color, 10, 5.5);
    }

    function segCircleHit(x1, y1, x2, y2, cx, cy, r) {
      const dx = x2 - x1;
      const dy = y2 - y1;
      const lenSq = dx * dx + dy * dy;
      let t = 0;
      if (lenSq > 0) t = Math.max(0, Math.min(1, ((cx - x1) * dx + (cy - y1) * dy) / lenSq));
      const px = x1 + dx * t;
      const py = y1 + dy * t;
      const ddx = cx - px;
      const ddy = cy - py;
      return ddx * ddx + ddy * ddy <= r * r;
    }

    function trySlice(x1, y1, x2, y2) {
      const dx = x2 - x1;
      const dy = y2 - y1;
      if (Math.hypot(dx, dy) <= 7) return;
      for (let i = orbs.length - 1; i >= 0; i--) {
        const orb = orbs[i];
        if (segCircleHit(x1, y1, x2, y2, orb.x, orb.y, orb.r)) sliceOrb(orb, i);
      }
    }

    function canvasPoint(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) * (canvas.width / rect.width),
        y: (e.clientY - rect.top) * (canvas.height / rect.height),
        t: performance.now()
      };
    }

    function resetGame() {
      state = 'playing';
      score = 0;
      lives = 3;
      combo = 1;
      lastSliceTime = -9999;
      spawnTimer = 0;
      shake = 0;
      flash = 0;
      slowmo = 0;
      orbs.length = 0;
      fragments.length = 0;
      particles.length = 0;
      popups.length = 0;
      trail.length = 0;
      setMessage('Slice fast for combos - bombs cost a life');
      syncBoxes();
    }

    function endGame() {
      state = 'over';
      if (score > best) {
        best = score;
        localStorage.setItem(BEST_KEY, best);
      }
      setMessage('Game over - press Space, click, or hit Restart');
    }

    function update() {
      if (state !== 'playing') return;
      frameCount++;
      const ts = slowmo > 0 ? 0.4 : 1;
      if (slowmo > 0) slowmo--;

      spawnTimer++;
      if (spawnTimer >= spawnGapFrames()) {
        spawnTimer = 0;
        spawnWave();
      }

      for (let i = orbs.length - 1; i >= 0; i--) {
        const orb = orbs[i];
        orb.vy += 0.165 * ts;
        orb.x += orb.vx * ts;
        orb.y += orb.vy * ts;
        if (orb.pop < 1) orb.pop = Math.min(1, orb.pop + 0.08);
        if (orb.bomb && particles.length < MAX_PARTICLES - 3) {
          const sparks = 2 + Math.floor(Math.random() * 2);
          for (let s = 0; s < sparks; s++) {
            addParticle({
              x: orb.x + rand(-3, 3),
              y: orb.y - orb.r - rand(0, 5),
              vx: rand(-0.8, 0.8),
              vy: rand(-1.6, -0.4),
              size: rand(1, 2),
              color: Math.random() < 0.5 ? '#fde68a' : '#f472b6',
              life: 1,
              decay: 0.08
            });
          }
        }
        if (orb.y > H + 40 && orb.vy > 0) {
          orbs.splice(i, 1);
          if (!orb.bomb) {
            lives--;
            combo = 1;
            shake = Math.max(shake, 6);
            if (lives <= 0) endGame();
            else setMessage('An orb slipped past your blade');
          }
        }
      }

      for (let i = fragments.length - 1; i >= 0; i--) {
        const f = fragments[i];
        f.vy += 0.165 * ts;
        f.x += f.vx * ts;
        f.y += f.vy * ts;
        f.angle += f.spin * ts;
        f.life -= 0.018;
        if (f.life <= 0 || f.y > H + 60) fragments.splice(i, 1);
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * ts;
        p.y += p.vy * ts;
        p.vy += 0.06 * ts;
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
      }

      for (let i = popups.length - 1; i >= 0; i--) {
        const pop = popups[i];
        pop.y -= 0.9;
        pop.life -= 0.02;
        if (pop.life <= 0) popups.splice(i, 1);
      }

      if (shake > 0) shake = Math.max(0, shake - 0.9);
      if (flash > 0) flash = Math.max(0, flash - 0.02);

      const cutoff = performance.now() - 160;
      while (trail.length && trail[0].t < cutoff) trail.shift();
      syncBoxes();
    }

    function drawOrb(orb) {
      const scale = 0.6 + 0.4 * orb.pop;
      ctx.save();
      ctx.translate(orb.x, orb.y);
      ctx.scale(scale, scale);
      if (orb.bomb) {
        ctx.shadowColor = '#f472b6';
        ctx.shadowBlur = 14;
        ctx.fillStyle = '#1a1026';
        ctx.beginPath();
        ctx.arc(0, 0, orb.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = '#f472b6';
        ctx.lineWidth = 2.5;
        ctx.stroke();
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        const k = orb.r * 0.34;
        for (const ox of [-orb.r * 0.36, orb.r * 0.36]) {
          ctx.beginPath();
          ctx.moveTo(ox - k * 0.5, -k * 0.5);
          ctx.lineTo(ox + k * 0.5, k * 0.5);
          ctx.moveTo(ox + k * 0.5, -k * 0.5);
          ctx.lineTo(ox - k * 0.5, k * 0.5);
          ctx.stroke();
        }
        ctx.strokeStyle = '#9aa3c2';
        ctx.beginPath();
        ctx.moveTo(0, -orb.r);
        ctx.lineTo(3, -orb.r - 7);
        ctx.stroke();
      } else {
        ctx.shadowColor = orb.color;
        ctx.shadowBlur = 16;
        const grad = ctx.createRadialGradient(-orb.r * 0.3, -orb.r * 0.3, 2, 0, 0, orb.r);
        grad.addColorStop(0, '#f4f6ff');
        grad.addColorStop(0.45, orb.color);
        grad.addColorStop(1, orb.color);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(0, 0, orb.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = orb.color;
        ctx.lineWidth = 2.5;
        ctx.stroke();
        ctx.fillStyle = 'rgba(244,246,255,0.9)';
        ctx.beginPath();
        ctx.arc(-orb.r * 0.4, -orb.r * 0.45, orb.r * 0.14, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawTrail() {
      if (trail.length < 2) return;
      const now = performance.now();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      for (let pass = 0; pass < 2; pass++) {
        for (let i = 1; i < trail.length; i++) {
          const a = trail[i - 1];
          const b = trail[i];
          const age = now - a.t;
          if (age > 160) continue;
          const fade = 1 - age / 160;
          const taper = i / trail.length;
          if (pass === 0) {
            ctx.strokeStyle = 'rgba(244,114,182,' + (0.25 * fade).toFixed(3) + ')';
            ctx.lineWidth = 12 * taper + 1;
          } else {
            ctx.strokeStyle = '#fdf2f8';
            ctx.globalAlpha = fade;
            ctx.lineWidth = 3.5 * taper + 0.5;
          }
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
      }
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function drawOverlayPanel(title, lines) {
      ctx.fillStyle = 'rgba(5,8,20,0.78)';
      roundRect(W / 2 - 220, H / 2 - 110, 440, 220, 18);
      ctx.fill();
      ctx.strokeStyle = 'rgba(167,139,250,0.5)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.textAlign = 'center';
      ctx.fillStyle = '#f472b6';
      ctx.font = 'bold 34px system-ui, sans-serif';
      ctx.fillText(title, W / 2, H / 2 - 55);
      ctx.font = '17px system-ui, sans-serif';
      for (let i = 0; i < lines.length; i++) {
        ctx.fillStyle = lines[i].color;
        ctx.fillText(lines[i].text, W / 2, H / 2 - 12 + i * 30);
      }
    }

    function render() {
      ctx.fillStyle = bgGradient;
      ctx.fillRect(0, 0, W, H);

      ctx.save();
      if (shake > 0) ctx.translate(rand(-shake, shake), rand(-shake, shake));

      for (const f of fragments) {
        ctx.save();
        ctx.translate(f.x, f.y);
        ctx.rotate(f.angle);
        ctx.globalAlpha = Math.max(0, f.life);
        ctx.fillStyle = f.color;
        ctx.beginPath();
        ctx.arc(0, 0, f.r, 0, Math.PI);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
      ctx.globalAlpha = 1;

      for (const orb of orbs) drawOrb(orb);

      for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
      }
      ctx.globalAlpha = 1;

      drawTrail();

      ctx.textAlign = 'center';
      for (const pop of popups) {
        ctx.globalAlpha = Math.max(0, pop.life);
        ctx.fillStyle = pop.color;
        ctx.font = 'bold ' + pop.size + 'px system-ui, sans-serif';
        ctx.fillText(pop.text, pop.x, pop.y);
      }
      ctx.globalAlpha = 1;

      ctx.restore();

      if (flash > 0) {
        ctx.fillStyle = 'rgba(244,63,94,' + flash.toFixed(3) + ')';
        ctx.fillRect(0, 0, W, H);
      }

      if (state === 'start') {
        drawOverlayPanel('NEON SLASH', [
          { text: 'Click to start - sweep your blade through the orbs', color: '#f4f6ff' },
          { text: 'Chain slices within 0.35s for combo points', color: '#9aa3c2' },
          { text: 'Bombs and dropped orbs cost a life', color: '#9aa3c2' }
        ]);
      } else if (state === 'over') {
        drawOverlayPanel('GAME OVER', [
          { text: 'Final Score: ' + score, color: '#f4f6ff' },
          { text: 'Best: ' + best, color: '#fde68a' },
          { text: 'Press Space or click to restart', color: '#9aa3c2' }
        ]);
      }
    }

    let lastTime = performance.now();
    let accumulator = 0;
    function frame(now) {
      let dt = (now - lastTime) / 1000;
      if (dt > 0.1) dt = 0.1;
      lastTime = now;
      accumulator += dt;
      while (accumulator >= STEP) {
        update();
        accumulator -= STEP;
      }
      render();
      requestAnimationFrame(frame);
    }

    canvas.addEventListener('pointerdown', (e) => {
      pointerDown = true;
      if (state !== 'playing') {
        resetGame();
        return;
      }
      trail.length = 0;
      trail.push(canvasPoint(e));
    });

    canvas.addEventListener('pointermove', (e) => {
      if (e.pointerType === 'touch' && !pointerDown) return;
      const pt = canvasPoint(e);
      const prev = trail[trail.length - 1];
      trail.push(pt);
      if (trail.length > 12) trail.shift();
      if (state === 'playing' && prev) trySlice(prev.x, prev.y, pt.x, pt.y);
    });

    window.addEventListener('pointerup', () => {
      pointerDown = false;
    });
    canvas.addEventListener('pointerleave', () => {
      trail.length = 0;
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code.startsWith('Arrow')) {
        e.preventDefault();
        if (e.code === 'Space' && state !== 'playing') resetGame();
      }
    });

    restartBtn.addEventListener('click', () => {
      resetGame();
    });

    syncBoxes();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
